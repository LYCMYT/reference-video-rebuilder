name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Python runtime dependencies
        shell: pwsh
        run: |
          python -c "import importlib.metadata as metadata; import jsonschema; from PIL import Image; print('jsonschema=' + metadata.version('jsonschema')); print('Pillow=' + metadata.version('Pillow'))"
      - name: Install FFmpeg for integration tests
        run: choco install ffmpeg --yes --no-progress
      - name: Verify FFmpeg tools
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Compile Python
        run: python -m compileall skills/rebuild-reference-video/scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate example Template IR
        run: python skills/rebuild-reference-video/scripts/video_remix.py validate-template skills/rebuild-reference-video/assets/project-template/template.ir.example.json --json
      - name: Validate example asset manifest
        run: python skills/rebuild-reference-video/scripts/video_remix.py validate-assets skills/rebuild-reference-video/assets/project-template/template.ir.example.json skills/rebuild-reference-video/assets/project-template/assets.example.json --allow-missing-files --json
